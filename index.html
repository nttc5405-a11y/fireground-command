<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火場指揮情境訓練｜S001 夜間透天厝一樓機車起火</title>
<style>
:root{
  --bg:#e7ebee;--panel:#ffffff;--ink:#16202a;--muted:#5b6672;--line:#cdd4db;--chip:#eef1f4;
  --red:#c8102e;--amber:#e39b00;--blue:#1f6fb2;--ok:#23824f;--sel:#1f6fb2;
  --sky:#c9d3dd;--ground:#8d8a84;--wall:#f1ede6;--wallline:#38404a;--street:#6d6b67;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1418;--panel:#182029;--ink:#e5eaef;--muted:#93a0ad;--line:#2c3742;--chip:#212b35;
    --sky:#1a2531;--ground:#3a3834;--wall:#2a2f35;--wallline:#a9b3bd;--street:#2d2c2a;--sel:#5c9bff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1418;--panel:#182029;--ink:#e5eaef;--muted:#93a0ad;--line:#2c3742;--chip:#212b35;
  --sky:#1a2531;--ground:#3a3834;--wall:#2a2f35;--wallline:#a9b3bd;--street:#2d2c2a;--sel:#5c9bff;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--sel);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--ink);padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.clock{font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
.gauges{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.gauges b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.meter{display:inline-block;width:64px;height:8px;background:var(--chip);border:1px solid var(--line);vertical-align:middle;margin:0 4px}
.meter i{display:block;height:100%;background:var(--red)}
.ctl{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.go{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}

main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:12px;max-width:1300px;margin:0 auto}
@media (max-width:880px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.panel h2{font-size:14px;margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 span{font-size:12px;font-weight:400;color:var(--muted)}
.scenewrap{position:relative}
svg.scene{width:100%;height:auto;display:block;border:1px solid var(--line)}
.banner{position:absolute;left:8px;right:8px;top:8px;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:6px 10px;border-radius:3px;display:none}
.banner.show{display:block}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .7s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
@media (prefers-reduced-motion:reduce){.flame{animation:none}}

.feed{max-height:240px;overflow:auto;font-size:13.5px}
.feed div{padding:5px 0;border-bottom:1px solid var(--chip);display:flex;gap:8px}
.feed time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.feed .alert{color:var(--red);font-weight:700}
.feed .good{color:var(--ok);font-weight:600}
.feed .cmd{color:var(--muted)}
.feed .radio span::before{content:"無線電｜";color:var(--blue);font-weight:700}

.crewlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.crew{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:4px;padding:6px 8px;cursor:pointer;background:var(--panel);min-height:54px}
.crew.sel{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 10%,var(--panel))}
.crew.busy{background:color-mix(in srgb,var(--amber) 24%,var(--panel));border-color:var(--amber)}
.crew.inside{background:color-mix(in srgb,var(--red) 24%,var(--panel));border-color:var(--red)}
.crew.busy .cst{color:var(--ink);font-weight:600}
.crew.gone{opacity:.45;cursor:default}
.cav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel);font-weight:800;font-size:13px;flex:none}
.crew.cmd .cav{background:var(--red);color:#fff}
.cinfo{min-width:0;flex:1;font-size:12.5px;line-height:1.3}
.cinfo b{font-size:14px}
.cst{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.air{height:5px;background:var(--chip);margin-top:4px;display:none;border:1px solid var(--line)}
.air i{display:block;height:100%}
.recall{font-size:12px;padding:3px 7px;border-radius:4px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:none;flex:none}

.zone{margin-top:10px}
.zone:first-child{margin-top:0}
.zone h3{font-size:13px;margin:0 0 5px;font-weight:700;border-left:4px solid var(--ink);padding-left:6px}
.zone.cz h3{border-color:var(--red)}
.zone[hidden]{display:none}
.ztabs{display:flex;gap:4px;overflow-x:auto;margin:12px 0 8px;border-bottom:2px solid var(--ink);scrollbar-width:none}
.ztabs::-webkit-scrollbar{display:none}
.ztab{flex:none;border:1px solid var(--line);border-bottom:none;background:var(--chip);padding:8px 12px;border-radius:4px 4px 0 0;cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap;position:relative}
.ztab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ztab .n{display:inline-block;min-width:20px;margin-left:5px;font-size:11.5px;padding:0 5px;border-radius:9px;background:var(--panel);color:var(--ink);text-align:center}
.ztab.alert::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
.task{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.task:hover{border-color:var(--ink)}
.task b{font-size:14px;font-weight:700}
.task small{font-size:12px;color:var(--muted);line-height:1.35}
.task .why{color:var(--amber);font-weight:600}
.task.na{opacity:.55}
.task.urgent{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:92vw}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.55);display:none;z-index:20;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.show{display:block}
.sheet{background:var(--panel);max-width:680px;margin:0 auto;border-radius:4px;padding:20px;border-top:6px solid var(--red)}
.sheet h1{font-size:22px;margin:0 0 4px;line-height:1.3}
.sheet h2{font-size:16px;margin:18px 0 6px}
.sheet p{margin:6px 0}
.sheet label{display:block;font-size:13px;font-weight:700;margin:10px 0 3px}
.sheet select,.sheet input{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ck{display:grid;grid-template-columns:28px 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--chip)}
.ck .ic{font-weight:800;font-size:16px;text-align:center}
.ck .pass{color:var(--ok)}.ck .fail{color:var(--red)}.ck .na{color:var(--muted)}
.ck small{grid-column:2;color:var(--muted);font-size:12.5px}
.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt td{padding:6px 4px;border-bottom:1px solid var(--chip)}
.tl{font-size:13px;max-height:300px;overflow:auto;border:1px solid var(--line);padding:4px 8px}
.tl div{padding:3px 0}
.tl time{color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header class="top">
  <div class="clock" id="clock">T+00:00<small id="modeTag"></small></div>
  <div class="gauges" id="gauges"></div>
  <div class="ctl" id="ctl">
    <button class="btn" id="bPause" type="button">暫停</button>
    <button class="btn" data-sp="1" type="button">1×</button>
    <button class="btn" data-sp="2" type="button">2×</button>
    <button class="btn" data-sp="4" type="button">4×</button>
    <button class="btn" id="bEnd" type="button">結束演練</button>
  </div>
</header>

<main>
  <div class="col">
    <section class="panel">
      <h2>現場剖面圖 <span>左：A面巷道 ／ 右：C面防火巷</span></h2>
      <div class="scenewrap">
        <svg class="scene" id="scene" viewBox="0 0 420 300" role="img" aria-label="透天厝剖面與現場部署"></svg>
        <div class="banner" id="banner"></div>
      </div>
    </section>
    <section class="panel">
      <h2>現場紀錄 <span>最新在上</span></h2>
      <div class="feed" id="feed"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel">
      <h2>人員 <span>先點人再點任務｜黃：派遣中　紅：入室</span></h2>
      <div class="crewlist" id="crew"></div>
    </section>
    <section class="panel">
      <h2>任務</h2>
      <div id="tasks"></div>
    </section>
  </div>
</main>

<div class="overlay show" id="start">
  <div class="sheet">
    <h1>S001 夜間透天厝一樓機車起火</h1>
    <p id="briefTxt"></p>
    <p>你是第一梯次帶隊官。到場後時間就開始流動：火勢會自己長大，受困者的狀況會惡化，所有決定都會被記錄下來，結束後產生事後檢討（AAR）。</p>
    <p>操作方式：先點選一位或多位待命人員，再點任務。灰色任務點下去會告訴你為什麼現在不能做。指揮類動作（初期報告、請求增援、點名）不需要選人。</p>
    <label for="optName">姓名</label>
    <input id="optName" autocomplete="name" placeholder="例：王小明">
    <label for="optUnit">單位</label>
    <input id="optUnit" placeholder="例：成功分隊">
    <label for="optCrew">第一梯次出勤人數（含帶隊官）</label>
    <select id="optCrew"><option value="4">4 人</option><option value="3">3 人</option></select>
    <label for="optMode">模式</label>
    <select id="optMode"><option value="practice">練習：可暫停、可加速</option><option value="exam">考核：不可暫停</option></select>
    <div class="row"><button class="btn go" id="bStart" type="button">到場，開始演練</button></div>
  </div>
</div>

<div class="overlay" id="report">
  <div class="sheet">
    <h1>初期報告</h1>
    <p class="hint">時間持續進行中。依你目前掌握的資訊回報，不確定的不要說成確定。</p>
    <label for="rBld">建物型態</label>
    <select id="rBld"><option value="">請選擇</option><option>透天厝3樓＋頂加</option><option>公寓大樓</option><option>鐵皮工廠</option></select>
    <label for="rFloor">起火樓層</label>
    <select id="rFloor"><option value="">請選擇</option><option>1樓</option><option>2樓</option><option>3樓</option><option>不明</option></select>
    <label for="rCond">火煙狀況</label>
    <select id="rCond"><option value="">請選擇</option><option>濃煙、未見明火</option><option>可見火光</option><option>全面燃燒</option></select>
    <label for="rVict">受困者</label>
    <select id="rVict"><option value="">請選擇</option><option>確認受困（含位置）</option><option>疑似有人受困</option><option>無人受困</option><option>不明</option></select>
    <label for="rMode">戰術模式</label>
    <select id="rMode"><option value="">請選擇</option><option>攻擊（室內）</option><option>過渡（先外後內）</option><option>防禦（外部）</option></select>
    <label for="rCp">指揮站</label>
    <select id="rCp"><option value="">請選擇</option><option>A面1號車旁</option><option>未設立</option></select>
    <label for="rReq">增援</label>
    <select id="rReq"><option value="no">暫不請求</option><option value="yes">請求第二梯次增援</option></select>
    <div class="row">
      <button class="btn go" id="bSendReport" type="button">發送報告</button>
      <button class="btn" id="bCancelReport" type="button">先不報</button>
    </div>
  </div>
</div>

<div class="overlay" id="aar"><div class="sheet" id="aarBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 劇本參數（可依轄區實況調整） ===== */
const CFG = {
  id:'S001', title:'夜間透天厝一樓機車起火',
  brief:'凌晨 02:10，受理報案：三層樓透天厝（含頂樓加蓋）一樓冒出濃煙。第一梯次出動水箱車 2 輛、救護車 1 輛。增援單位距離遠，請求後約 8 分鐘到場。',
  timeLimit:1200,                 // 演練上限（秒）
  fire:{F0:38, base:0.06, shutterMul:3, controlledMul:1.5, backMul:1.5, ventMul:1.4, interior:0.42, exterior:0.25, warn:75},
  smoke:{St0:45, C20:35, C30:30},
  water:{flow:6, tank1:2000, tank2:2000, reserve:8000}, // 公升；1.5吋線約 360 L/min
  air:900, airWarn:300,           // 空氣瓶可作業秒數、低壓警告
  eta:480,                        // 增援到場時間（秒）
  gasUrl:'https://script.google.com/macros/s/AKfycbzrL1PyDgbnfsrLX9abdJHh5pPbULZWXXjz5P0N0nTrTtQq3AJuJkMhiyyqPWWyK1Er/exec',                      // ← 貼上 GAS 網頁應用程式網址（https://script.google.com/macros/s/.../exec），留空則不上傳
  sonAt:100, sonWindow:35,        // 關係人衝入事件
  victims:[
    {id:'kid', name:'孫子（10歲）', room:'3F前側（房門關閉）', hp:100},
    {id:'gma', name:'阿嬤（78歲）', room:'3F後側（房門開啟）', hp:80},
  ],
};

/* ===== 狀態 ===== */
const $ = s => document.querySelector(s);
let S = null, timer = null, toastT = null, curZone = 'A面';
const selected = new Set();
const fmt = t => `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;

function newState(n, mode){
  const base = [['帶隊官','帶',true],['隊員甲','甲'],['隊員乙','乙'],['隊員丙','丙']].slice(0,n);
  return {
    t:0, n, mode, runId:Date.now().toString(36)+Math.random().toString(36).slice(2,6), tester:{name:'',unit:''}, sent:false, speed:1, paused:false, over:false, endReason:'',
    F:CFG.fire.F0, St:CFG.smoke.St0, C2:CFG.smoke.C20, C3:CFG.smoke.C30,
    shutter:false, back:false, ladder:false, bars:false, line:false, hydrant:false, ambGone:false,
    tank1:CFG.water.tank1, tank2:CFG.water.tank2, attackOn:false,
    know:{A:false, C:false, interview:false},
    son:'calm', sonDeadline:0, warned:{}, banner:null,
    victims:CFG.victims.map(v=>({...v, status:'trapped', known:false})),
    crew:base.map((c,i)=>({id:'c'+i, name:c[0], ab:c[1], cmd:!!c[2], task:null, inside:false, air:CFG.air, gone:false, note:''})),
    active:[], seq:0,
    reinf:{req:null, arrived:false},
    ck:{sizeA:null, report:null, reportEval:null, interview:null, reinforce:null, shutter:null, waterAtShutter:null,
        ventBeforeWater:null, tankDry:false, cmdBusy:0, minOut:null, rit:null, par:[], flashover:null, mayday:null,
        transportSolo:false, firstWater:null, knockdown:null, out:null},
    log:[]
  };
}
const crewById = id => S.crew.find(c=>c.id===id);
const actOf = id => S.active.filter(a=>a.def.id===id);
const has = id => actOf(id).length>0;
const V = id => S.victims.find(v=>v.id===id);
const waterSrc = () => S.hydrant || S.tank1>0;
const waterReady = () => S.line && has('pump') && waterSrc();
const names = ids => ids.map(i=>crewById(i).name).join('、');

function log(msg, type='info'){
  S.log.unshift({t:S.t, msg, type});
  if(type==='alert') S.banner = {msg, until:S.t+8};
  renderFeed();
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2400);}

function gotInfo(){
  if(S.know.interview) return;
  S.know.interview=true; S.ck.interview=S.t;
  V('kid').known=true; V('gma').known=true;
  if(S.son!=='entered') S.son='handled';
  log('關係人：「我媽睡三樓後面那間，我兒子在三樓前面房間！他房門平常會關……」','radio');
}
function rescue(v, how){
  v.known=true; v.status='out'; v.outAt=S.t;
  log(`${how}救出${v.name}，移至救護車旁（生命徵象：${hpTxt(v.hp)}）`,'good');
}
const hpTxt = h => h>60?'穩定':h>30?'微弱':'危急';

/* ===== 任務定義 ===== */
const TASKS = [
  {id:'sizeA', zone:'A面', name:'A面環場評估', min:1,max:1, dur:20, desc:'看建物、火煙、進入點',
   avail:()=>S.know.A?'已完成':true,
   done:()=>{S.know.A=true;S.ck.sizeA=S.t;
     log('A面評估：三層透天＋頂加，一樓鐵捲門緊閉、門縫竄濃煙；二、三樓窗戶冒煙；三樓前窗有鐵窗。巷寬約4公尺，雲梯車進不來。');}},
  {id:'interview', zone:'A面', name:'詢問關係人', min:1,max:1, dur:30, desc:'確認屋內有誰、在哪裡',
   avail:()=>S.know.interview?'已完成':S.son==='entered'?'關係人已衝入火場':true, done:gotInfo},
  {id:'stopSon', zone:'A面', name:'攔阻並安撫關係人', min:1,max:1, dur:15, desc:'關係人要衝進火場',
   hidden:()=>!['agitated','stopping'].includes(S.son), urgent:true,
   avail:()=>S.son==='agitated'?true:'目前無此狀況',
   start:()=>{S.son='stopping'}, done:()=>{S.son='handled';gotInfo();}},
  {id:'forceShutter', zone:'A面', name:'破壞鐵捲門', min:2,max:2, dur:90, desc:'開門等於給火氧氣',
   avail:()=>!S.know.A?'需先完成A面評估':S.shutter?'已開啟':true,
   done:()=>{S.shutter=true;S.ck.shutter=S.t;S.ck.waterAtShutter=waterReady();
     log(S.ck.waterAtShutter?'鐵捲門開啟，水線已充水待命。':'鐵捲門開啟，濃煙湧出，水線尚未就緒！', S.ck.waterAtShutter?'info':'alert');}},
  {id:'doorCtl', zone:'A面', name:'控制鐵捲門開口', min:1,max:1, dur:null, desc:'持續：半掩開口，減少進氣',

/* ===== 指令 ===== */
function clickTask(t){
  if(S.over) return;
  const r=t.avail(); if(r!==true){toast(r);return;}
  const ids=[...selected].filter(id=>{const c=crewById(id);return c&&!c.task&&!c.gone;});
  if(!ids.length){toast('先點選待命人員，再點任務');return;}
  if(ids.length<t.min){toast(`「${t.name}」需要 ${t.min} 人`);return;}
  if(ids.length>t.max){toast(`「${t.name}」最多 ${t.max} 人`);return;}
  const a={key:++S.seq, def:t, crew:ids, start:S.t};
  a.total = t.dur==null?null:(typeof t.dur==='function'?t.dur(a):t.dur); a.left=a.total;
  S.active.push(a);
  ids.forEach(id=>{const c=crewById(id);c.task=a.key;c.inside=!!t.idlh;});
  if(t.start) t.start(a);
  log(`${names(ids)}：${t.name}`,'cmd');
  selected.clear(); render();
}
function removeActive(a){
  S.active=S.active.filter(x=>x!==a);
  a.crew.forEach(id=>{const c=crewById(id);if(c){c.task=null;c.inside=false;}});
}
function recallCrew(id){
  const c=crewById(id); const a=S.active.find(x=>x.key===c.task); if(!a) return;
  removeActive(a); if(a.def.id==='stopSon'&&S.son==='stopping') S.son='agitated';
  log(`${a.def.name}中止，${names(a.crew)}撤回待命`,'cmd'); render();
}
function toggleSel(id){
  const c=crewById(id); if(S.over||c.gone) return;
  if(c.task){toast('執行任務中，要改派請先按「撤回」');return;}
  selected.has(id)?selected.delete(id):selected.add(id); renderCrew();
}
function reqReinf(){
  if(S.over) return;
  if(S.reinf.req!=null){toast('已請求增援');return;}
  S.reinf.req=S.t; S.ck.reinforce=S.t;
  log('帶隊官：請求第二梯次增援。指揮中心：收到，預估 8 分鐘到場。','radio'); render();
}
function doPar(){
  if(S.over) return;
  const on=S.crew.filter(c=>!c.gone), ins=on.filter(c=>c.inside);
  S.ck.par.push(S.t);
  log(`PAR 點名：場內 ${ins.length} 人、場外 ${on.length-ins.length} 人，全員回應。`,'radio');
}
function openReport(){
  if(S.over) return;
  if(S.ck.report!=null){toast('初期報告已發送');return;}
  $('#report').classList.add('show');
}
function sendReport(){
  const d={bld:$('#rBld').value,floor:$('#rFloor').value,cond:$('#rCond').value,vict:$('#rVict').value,mode:$('#rMode').value,cp:$('#rCp').value};
  const errs=[], missing=Object.keys(d).filter(k=>!d[k]);
  if(d.bld&&d.bld!=='透天厝3樓＋頂加') errs.push('建物型態錯誤');
  if(d.floor&&d.floor!=='1樓') errs.push(S.know.A?'起火樓層錯誤':'未評估即回報樓層');
  if(d.cond==='全面燃燒') errs.push('火煙狀況誇大');
  const knows=S.know.interview||V('kid').known;
  if(knows&&d.vict&&d.vict!=='確認受困（含位置）') errs.push('已掌握受困者卻未回報');
  if(!knows&&d.vict==='確認受困（含位置）') errs.push('受困者尚未確認就回報確認');
  if(!knows&&d.vict==='無人受困') errs.push('未查證就排除受困者');
  if(d.cp==='未設立') errs.push('未設立指揮站');
  S.ck.report=S.t; S.ck.reportEval={d,errs,missing};
  log(`初期報告：${d.bld||'—'}，${d.floor||'—'}起火，${d.cond||'—'}；受困者${d.vict||'—'}；採${d.mode||'—'}；指揮站${d.cp||'—'}。`,'radio');
  if($('#rReq').value==='yes') reqReinf();
  $('#report').classList.remove('show'); render();
}

function mayday(reason, ids){
  if(S.ck.mayday) return;
  const rit=has('rit');
  S.ck.mayday={t:S.t, reason, rit};
  log(`MAYDAY！MAYDAY！${reason}`,'alert');
  if(rit){
    [...new Set(S.active.filter(a=>a.crew.some(i=>ids.includes(i))))].forEach(removeActive);
    ids.forEach(id=>{const c=crewById(id);c.gone=true;c.note='受傷送醫';});
    log('RIT 立即進入，受困隊員已救出送醫。','good');
  } else endGame(`MAYDAY：${reason}，現場沒有 RIT 可以立即救援`);
}

/* ===== 每秒推進 ===== */
function cond(v){
  if(v.id==='kid') return S.C3*((S.bars&&!S.attackOn)?1.0:0.65);
  if(v.id==='gma') return S.C3;
  if(v.id==='son') return Math.min(100,S.F*1.1);
  return S.C3;
}
function tick(){
  if(!S||S.over||S.paused) return;
  S.t++;
  const f=CFG.fire;

  for(const a of [...S.active]){
    if(a.total!=null){a.left--; if(a.left<=0){removeActive(a); if(a.def.done) a.def.done(a); if(S.over) return;}}
  }

  // 射水與用水
  let knock=0; S.attackOn=false;
  for(const a of S.active){
    if(a.def.id!=='intAttack'&&a.def.id!=='extAttack') continue;
    if(!waterReady()) continue;
    S.attackOn=true;
    knock += a.def.id==='intAttack'?f.interior:f.exterior*(a.crew.length>=2?1:0.7);
    if(!S.hydrant){
      S.tank1-=CFG.water.flow;
      if(S.tank1<=0){S.tank1=0; if(!S.warned.dry){S.warned.dry=1;S.ck.tankDry=true;log('1號車水箱見底，水線斷水！','alert');}}
    }
  }
  if(S.attackOn&&S.ck.firstWater==null) S.ck.firstWater=S.t;
  if(!S.hydrant&&S.tank1>0&&S.tank1<=600&&!S.warned.low){S.warned.low=1;log('1號車水量剩不到 600 公升（約 1.5 分鐘）。','alert');}

  // 火勢
  let mul=1;
  if(S.shutter) mul*=has('doorCtl')?f.controlledMul:f.shutterMul;
  if(S.back) mul*=f.backMul;
  if(S.bars&&!S.attackOn) mul*=f.ventMul;
  if(S.F>0&&S.F<100) S.F+=f.base*mul;
  S.F=Math.max(0,Math.min(100,S.F-knock));

  // 煙層
  const tgt=S.F*(S.shutter?0.85:1)*(S.back?0.9:1);
  S.St+=(tgt-S.St)*0.015;
  S.C2+=(S.St*0.85-S.C2)*0.01;
  let t3=S.St; if(S.bars) t3*=(S.attackOn||S.F<30)?0.55:1.05;
  S.C3+=(t3-S.C3)*0.008;

  // 火況事件
  if(S.F>=f.warn&&!S.warned.fw&&S.ck.flashover==null){S.warned.fw=1;log('一樓出現閃燃徵兆：煙層下沉、熱氣變強、天花板有滾燃。','alert');}
  if(S.F>=100&&S.ck.flashover==null){
    S.ck.flashover=S.t; log('一樓閃燃！','alert');
    const ins=S.active.filter(a=>a.def.id==='intAttack'||a.def.id==='search');
    if(ins.length){const ids=ins.flatMap(a=>a.crew);mayday(`一樓閃燃，${names(ids)}受困室內`,ids);if(S.over)return;}
  }
  if(S.F<15&&S.ck.knockdown==null&&S.ck.firstWater!=null){S.ck.knockdown=S.t;log('火勢已獲控制。','good');}
  if(S.F<=0&&S.ck.out==null){S.ck.out=S.t;log('火勢撲滅，進入殘火處理。','good');}

  // 受困者
  for(const v of S.victims){
    if(v.status==='trapped'){
      v.hp-=Math.max(0,cond(v)-30)*(v.id==='son'?0.03:0.015);
      if(v.hp<=0){v.hp=0;v.status='dead';v.deadAt=S.t;}
    } else if(v.status==='out'){
      if(has('care')) v.hp=Math.min(100,v.hp+0.02);
      else {v.hp-=0.03; if(v.hp<=0){v.hp=0;v.status='dead';v.deadAt=S.t;log(`${v.name}救出後無人照護，傷重。`,'alert');}}
    }
  }
  const kid=V('kid');
  if(S.know.A&&S.t>=70&&!kid.known&&kid.status==='trapped'){kid.known=true;log('三樓前窗有孩童隔著鐵窗呼救！','alert');}

  // 關係人
  if(S.son==='calm'&&!S.know.interview&&S.t>=CFG.sonAt){
    S.son='agitated';S.sonDeadline=S.t+CFG.sonWindow;
    log('屋主兒子情緒激動，拿著鑰匙要衝進去救母親！','alert');
  }
  if(S.son==='agitated'&&S.t>=S.sonDeadline&&!has('interview')){
    S.son='entered';
    S.victims.push({id:'son',name:'屋主兒子',room:'1F樓梯',hp:100,status:'trapped',known:true});
    log('屋主兒子由鐵捲門側小門衝進火場，沒有出來！','alert');
  }

  // 空氣
  for(const c of S.crew){
    if(!c.inside||c.gone) continue;
    c.air--;
    if(c.air===CFG.airWarn) log(`${c.name}空氣瓶低壓警報（剩約5分鐘）`,'alert');
    if(c.air<=0){const a=S.active.find(x=>x.key===c.task);mayday(`${c.name}空氣耗盡`,a?a.crew:[c.id]);if(S.over)return;}
  }

  // 增援
  if(S.reinf.req!=null&&!S.reinf.arrived&&S.t>=S.reinf.req+CFG.eta){
    S.reinf.arrived=true;
    ['增援隊員1','增援隊員2','增援隊員3'].forEach((n,i)=>S.crew.push({id:'r'+i,name:n,ab:'援'+(i+1),cmd:false,task:null,inside:false,air:CFG.air,gone:false,note:''}));
    S.tank2+=CFG.water.reserve;
    log('第二梯次到場：增援 3 人＋水庫車 8,000 公升（可用「2號車水量轉入」補水）。','good');
  }

  // 紀錄
  const c0=S.crew[0]; if(c0.task) S.ck.cmdBusy++;
  if(S.crew.some(c=>c.inside&&!c.gone)){
    const outN=S.crew.filter(c=>!c.gone&&!c.inside).length;
    S.ck.minOut=S.ck.minOut==null?outN:Math.min(S.ck.minOut,outN);
  }

  render();
  if(S.t>=CFG.timeLimit) return endGame('演練時間到');
  if(S.victims.every(v=>v.status!=='trapped')&&S.F<=0) endGame('火勢撲滅，受困者均已處置');
}

const smk = c => `rgba(30,28,27,${Math.min(.9,Math.max(0,c/100)).toFixed(2)})`;
const vcol = h => h>60?'#23824f':h>30?'#e39b00':'#c8102e';
function renderScene(){
  const F=S.F;
  let s=`<rect width="420" height="262" fill="var(--sky)"/><rect y="262" width="420" height="38" fill="var(--ground)"/>`;
  s+=`<text x="6" y="16" font-size="11" font-weight="700" fill="var(--ink)">A面 巷道</text><text x="414" y="16" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="end">C面 防火巷</text>`;
  s+=`<rect x="352" y="96" width="68" height="166" fill="var(--wall)" stroke="var(--wallline)" stroke-width="1" opacity=".55"/><text x="386" y="90" font-size="9" fill="var(--muted)" text-anchor="middle">後方鄰房</text>`;
  // 建物
  s+=`<rect x="130" y="106" width="180" height="156" fill="var(--wall)"/><rect x="168" y="70" width="104" height="36" fill="var(--wall)"/>`;
  const zones=[
    [130,210,75,52,Math.max(S.St*0.7,F*0.9)],[235,210,75,52,S.St*0.8],
    [205,106,30,156,S.St],
    [130,158,75,52,S.C2],[235,158,75,52,S.C2],
    [130,106,75,52,cond(V('kid'))],[235,106,75,52,S.C3],
    [168,70,104,36,S.C3*0.85]];
  zones.forEach(z=>s+=`<rect x="${z[0]}" y="${z[1]}" width="${z[2]}" height="${z[3]}" fill="${smk(z[4])}"/>`);
  if(F>0){

function updateTasks(){
  const cnt={},urg={},vis={};
  TASKS.forEach(t=>{
    const b=document.querySelector(`.task[data-id="${t.id}"]`); if(!b) return;
    const r=S.over?'演練已結束':t.avail(), ok=r===true;
    const hide=(t.hidden&&t.hidden())||(typeof r==='string'&&r.startsWith('已'));
    b.style.display=hide?'none':'';
    b.classList.toggle('na',!ok); b.classList.toggle('urgent',!!t.urgent&&ok);
    b.querySelector('.why').textContent=ok?'':r;
    if(ok) cnt[t.zone]=(cnt[t.zone]||0)+1;
    if(ok&&t.urgent) urg[t.zone]=1;
    if(!hide) vis[t.zone]=1;
  });
  document.querySelectorAll('.ztab').forEach(b=>{const z=b.dataset.z,on=z===curZone;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);b.classList.toggle('alert',!!urg[z]&&!on);b.querySelector('.n').textContent=cnt[z]||0;});
  document.querySelectorAll('#tasks .zone[data-z]').forEach(d=>{d.hidden=d.dataset.z!==curZone;d.querySelector('.empty').hidden=!!vis[d.dataset.z];});
  $('#bReport').classList.toggle('na',S.ck.report!=null);
  $('#bReinf').classList.toggle('na',S.reinf.req!=null);
}

/* ===== 上傳 AAR 至 Google Sheets ===== */
async function sendAAR(items){
  const st=$('#sendStatus'); if(!st) return;
  if(!CFG.gasUrl){st.textContent='尚未設定 Google Sheets 網址，本次結果未上傳。';return;}
  if(S.t<20){st.textContent='演練時間過短，未上傳。';return;}
  if(S.sent){st.textContent='✓ 本次結果已上傳。';return;}
  const c=S.ck, stTxt={trapped:'仍受困',out:'已救出',transported:'已後送',dead:'死亡'};
  const payload={
    runId:S.runId, name:S.tester.name, unit:S.tester.unit, scenario:`${CFG.id} ${CFG.title}`,
    crew:S.n, mode:S.mode, reason:S.endReason, duration:S.t,
    saved:S.victims.filter(v=>(v.status==='out'||v.status==='transported')&&v.hp>0).length, total:S.victims.length,
    victims:S.victims.map(v=>({name:v.name,status:stTxt[v.status]+(v.status==='dead'?'':`（${hpTxt(v.hp)}）`)})),
    flashover:c.flashover, mayday:c.mayday,
    checks:items.map(i=>({item:i[0],pass:i[1],detail:i[2]})),
    passCount:items.filter(i=>i[1]===true).length, checkCount:items.filter(i=>i[1]!==null).length,
    log:[...S.log].reverse()
  };
  const body=JSON.stringify(payload), opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body};
  st.textContent='上傳中…';
  try{
    const r=await fetch(CFG.gasUrl,opt); const j=await r.json();
    if(!j.ok) throw new Error(j.error||'寫入失敗');
    S.sent=true; st.textContent=j.dup?'✓ 此紀錄先前已上傳。':'✓ 已上傳到 Google Sheets。';
  }catch(e){
    try{
      await fetch(CFG.gasUrl,{...opt,mode:'no-cors'});
      S.sent=true; st.textContent='已送出（瀏覽器無法確認回應，請到試算表確認）。';
    }catch(e2){ st.textContent='上傳失敗，請確認網路後按「重新上傳」。'; }
  }
}
