<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="指揮訓練">
<meta name="description" content="第一梯次帶隊官情境訓練：夜間透天厝火災、車禍救助、汽油槽車洩漏，在人力有限與時間壓力下練習決策。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="消防指揮情境訓練">
<meta property="og:title" content="消防指揮情境訓練">
<meta property="og:description" content="第一梯次帶隊官情境訓練：夜間火災、車禍救助、槽車洩漏，在人力有限與時間壓力下練習決策。">
<meta property="og:url" content="https://fireground-command-uwb9.onrender.com/">
<meta property="og:image" content="https://fireground-command-uwb9.onrender.com/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://fireground-command-uwb9.onrender.com/og-image.png">
<title>消防指揮情境訓練</title>
<style>
:root{
  --bg:#f3f5f7;--panel:#ffffff;--ink:#05090d;--muted:#33404c;--line:#6f7b87;--chip:#e4e9ee;
  --red:#c8102e;--amber:#e39b00;--blue:#1f6fb2;--ok:#23824f;--sel:#1f6fb2;
  --sky:#c9d3dd;--ground:#8d8a84;--wall:#f1ede6;--wallline:#38404a;--street:#6d6b67;--grass:#a7b593;--road:#575b61;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1418;--panel:#182029;--ink:#e5eaef;--muted:#93a0ad;--line:#2c3742;--chip:#212b35;
  --sky:#1a2531;--ground:#3a3834;--wall:#2a2f35;--wallline:#a9b3bd;--street:#2d2c2a;--sel:#5c9bff;--grass:#2b3426;--road:#2c3035;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,.crew:focus-visible{outline:3px solid var(--sel);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--ink);padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.clock{font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.gauges{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.gauges b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.meter{display:inline-block;width:60px;height:8px;background:var(--chip);border:1px solid var(--line);vertical-align:middle;margin:0 4px}
.meter i{display:block;height:100%;background:var(--red)}
.meter.blue i{background:var(--blue)}
.ctl{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.go{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}

main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:12px;max-width:1300px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.panel h2{font-size:14px;margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 span{font-size:12px;font-weight:400;color:var(--muted)}
svg.scene{width:100%;height:auto;display:block;border:1px solid var(--line)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .7s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
.ticker{display:none;width:100%;text-align:left;margin-top:6px;border:1px solid var(--line);background:var(--chip);border-radius:4px;padding:6px 8px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker time{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.ticker.alert{color:var(--red);font-weight:700}

.feed{max-height:260px;overflow:auto;font-size:13.5px}
.feed div{padding:5px 0;border-bottom:1px solid var(--chip);display:flex;gap:8px}
.feed time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.feed .alert{color:var(--red);font-weight:700}
.feed .good{color:var(--ok);font-weight:600}
.feed .cmd{color:var(--muted)}
.feed .radio span::before{content:"無線電｜";color:var(--blue);font-weight:700}

.crewlist{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:start}
.utabs,.qsel{display:none}
.ugrp{display:flex;flex-direction:column;gap:6px;min-width:0}
.uhd{font-size:12px;font-weight:700;color:var(--muted)}
.ugrp .crew{flex-wrap:wrap;gap:4px 8px}
.crew[data-u="own"]{border-left:7px solid #16202a}
.crew{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:4px;padding:6px 8px;cursor:pointer;background:var(--panel);min-height:54px}
.crew.sel{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 12%,var(--panel))}
.crew.busy{background:color-mix(in srgb,var(--amber) 24%,var(--panel));border-color:var(--amber)}
.crew.inside{background:color-mix(in srgb,var(--red) 24%,var(--panel));border-color:var(--red)}
.crew.busy .cst{color:var(--ink);font-weight:600}
.crew.gone{opacity:.45;cursor:default;background:var(--chip);border-color:var(--line)}
.cav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel);font-weight:800;font-size:12px;flex:none}
.crew.cmd .cav{background:var(--red);color:#fff}
.crew[data-u="A"]{border-left:7px solid #1f6fb2}
.crew[data-u="B"]{border-left:7px solid #7a3fb0}
.crew[data-u="R"]{border-left:7px solid #23824f}
.cinfo{min-width:0;flex:1;font-size:12.5px;line-height:1.3}
.cinfo b{font-size:14px}
.cst{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.air{height:5px;background:var(--chip);margin-top:4px;display:none;border:1px solid var(--line)}
.air i{display:block;height:100%}
.recall{font-size:12px;padding:3px 7px;border-radius:4px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:none;flex:none}

.zone h3{font-size:13px;margin:0 0 5px;font-weight:700;border-left:4px solid var(--red);padding-left:6px}
.zone[hidden]{display:none}
.ztabs{display:flex;gap:4px;overflow-x:auto;margin:12px 0 8px;border-bottom:2px solid var(--ink);scrollbar-width:none}
.ztabs::-webkit-scrollbar{display:none}
.ztab{flex:none;border:1px solid var(--line);border-bottom:none;background:var(--chip);padding:8px 12px;border-radius:4px 4px 0 0;cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap;position:relative}
.ztab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ztab .n{display:inline-block;min-width:20px;margin-left:5px;font-size:11.5px;padding:0 5px;border-radius:9px;background:var(--panel);color:var(--ink);text-align:center}
.ztab .r{display:none;margin-left:4px;font-size:11.5px;color:var(--amber)}
.ztab.running .r{display:inline}
.ztab.alert::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
.task{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.task:hover{border-color:var(--ink)}
.task b{font-size:14px;font-weight:700}
.task small{font-size:12px;color:var(--muted);line-height:1.35}
.task .why{color:var(--amber);font-weight:600}
.task.na{opacity:.55}
.task.urgent{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.task .run{display:none;color:var(--ink);font-weight:700}
.task .prog{display:none;height:5px;background:var(--chip);margin-top:4px;border:1px solid var(--line)}
.task .prog i{display:block;height:100%;background:var(--amber);width:0}
.task.running{opacity:1;border:2px solid var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--panel))}
.task.running .run,.task.running .prog{display:block}
.task.running .why{display:none}
.task.cont .prog i{width:100%;background:repeating-linear-gradient(45deg,var(--amber) 0 6px,color-mix(in srgb,var(--amber) 50%,var(--panel)) 6px 12px)}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}

.tips{position:fixed;right:12px;top:70px;width:min(92vw,340px);display:flex;flex-direction:column;gap:6px;z-index:34;pointer-events:none}
.tip{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-left:7px solid var(--blue);border-radius:6px;padding:8px 12px;font-size:14px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateX(24px);transition:opacity .25s,transform .25s}
.tip.show{opacity:1;transform:none}
.tip.good{border-left-color:var(--ok)}
.tip small{display:block;color:var(--muted);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:92vw}
.toast.show{opacity:1}
.alertpop{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-24px);opacity:0;pointer-events:none;z-index:35;width:min(92vw,540px);background:var(--red);color:#fff;border-radius:6px;padding:14px 16px 12px 56px;font-weight:700;font-size:16.5px;line-height:1.45;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:transform .25s ease-out,opacity .25s;cursor:pointer}
.alertpop::before{content:"!";position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-size:20px;font-weight:900}
.alertpop small{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:6px}
.alertpop.show{transform:translate(-50%,0);opacity:1;pointer-events:auto;animation:shake .45s .25s}
@keyframes shake{0%,100%{margin-left:0}20%{margin-left:-8px}40%{margin-left:8px}60%{margin-left:-5px}80%{margin-left:5px}}
.flash{position:fixed;inset:0;border:7px solid var(--red);pointer-events:none;z-index:34;opacity:0}
.flash.on{animation:flash 1s}
@keyframes flash{0%,100%{opacity:0}15%,55%{opacity:1}35%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.flame{animation:none}.alertpop.show{animation:none}.flash.on{animation:none}}

.overlay{position:fixed;inset:0;background:rgba(10,14,18,.55);display:none;z-index:20;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.show{display:block}
#choice{z-index:30}
.sheet{background:var(--panel);max-width:680px;margin:0 auto;border-radius:4px;padding:20px;border-top:6px solid var(--red)}
.sheet h1{font-size:22px;margin:0 0 4px;line-height:1.3}
.sheet h2{font-size:16px;margin:18px 0 6px}
.sheet p{margin:6px 0}
.sheet label{display:block;font-size:13px;font-weight:700;margin:10px 0 3px}
.sheet textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit;resize:vertical}
.sheet select,.sheet input{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:12px 0}
.sc{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:4px;padding:10px;cursor:pointer}
.sc b{display:block;font-size:15px;line-height:1.35}
.sc small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.sc .tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);padding:1px 7px;border-radius:3px;margin-bottom:5px}
.sc.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--panel))}
.sc.on .tag{background:var(--red)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choices .btn{text-align:left;padding:12px 14px;font-size:15px;font-weight:600}
.ck{display:grid;grid-template-columns:28px 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--chip)}
.ck .ic{font-weight:800;font-size:16px;text-align:center}
.ck .pass{color:var(--ok)}.ck .fail{color:var(--red)}.ck .na{color:var(--muted)}
.ck small{grid-column:2;color:var(--muted);font-size:12.5px}
.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt td{padding:6px 4px;border-bottom:1px solid var(--chip);vertical-align:top}
.tl{font-size:13px;max-height:300px;overflow:auto;border:1px solid var(--line);padding:4px 8px}
.tl div{padding:3px 0}
.tl time{color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.imgprev{display:block;width:100%;height:auto;border:1px solid var(--line);margin-top:12px}

@media (max-width:880px){main{grid-template-columns:1fr}}
@media (max-width:720px){
  body{font-size:14px}
  .top{padding:6px 10px;gap:4px 8px}
  .clock{font-size:20px}
  .gauges{order:3;width:100%;font-size:11.5px;gap:2px 10px}
  .meter{width:44px}
  .btn{padding:5px 8px;font-size:12.5px}
  main{padding:8px;gap:8px}
  .col{gap:8px}
  .panel{padding:8px}
  .panel h2{margin-bottom:6px}
  .feedp{display:none}
  .ticker{display:block}
  .utabs{display:flex;gap:4px;margin-bottom:6px}
  .utab{flex:1;position:relative;border:2px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 4px;font-weight:700;font-size:13px;cursor:pointer;line-height:1.25}
  .utab small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
  .utab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  .utab.on small{color:var(--panel)}
  .utab[data-u="A"]{border-bottom:5px solid #1f6fb2}
  .utab[data-u="B"]{border-bottom:5px solid #7a3fb0}
  .utab[data-u="R"]{border-bottom:5px solid #23824f}
  .utab[data-u="own"]{border-bottom:5px solid #16202a}
  .utab .dot{position:absolute;top:3px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--red);display:none}
  .utab.warn .dot{display:block}
  .qsel{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .qsel .btn{flex:1 1 0;min-width:0;padding:7px 4px;white-space:nowrap}
  .qsel .cnt{flex:1 0 100%;font-size:12px;color:var(--muted)}
  .crewlist{display:grid;grid-auto-flow:row;grid-template-columns:1fr 1fr;grid-auto-columns:auto;gap:6px}
  .ugrp{display:none}
  .ugrp.act{display:contents}
  .uhd{display:none}
  .crew{width:auto;min-width:0;min-height:50px;padding:5px 6px;flex-wrap:wrap;gap:4px 6px}
  .crew .cinfo{flex:1 1 90px}
  .crew .recall{margin-left:auto}
  .cinfo b{font-size:13px}
  .recall{padding:2px 5px;font-size:11px}
  .tasks{grid-template-columns:1fr 1fr}
  .task{padding:7px 8px}
  .task .desc{display:none}
  .task b{font-size:13.5px}
  .ztab{padding:7px 10px;font-size:13px}
  .alertpop{top:calc(56px + env(safe-area-inset-top,0px));font-size:15.5px}
  .tips{left:8px;right:8px;width:auto}
  .tip{font-size:13px;padding:7px 10px}
  .two{grid-template-columns:1fr}
  .sheet{padding:16px}
}
</style>
</head>
<body>

<header class="top">
  <div class="clock" id="clock">T+00:00</div>
  <div class="gauges" id="gauges"></div>
  <div class="ctl">
    <button class="btn" id="bSup" type="button">呼叫支援單位</button>
    <button class="btn" id="bFb" type="button">意見回饋</button>
    <button class="btn" id="bSound" type="button" aria-label="提示音開關">提示音：開</button>
    <button class="btn" id="bPause" type="button">暫停</button>
    <button class="btn" data-sp="1" type="button">1×</button>
    <button class="btn" data-sp="2" type="button">2×</button>
    <button class="btn" data-sp="4" type="button">4×</button>
    <button class="btn" id="bEnd" type="button">結束</button>
  </div>
</header>

<main>
  <div class="col">
    <section class="panel">
      <h2 id="scTitle">現場</h2>
      <svg class="scene" id="scene" viewBox="0 0 420 300" role="img" aria-label="現場圖與人員部署"></svg>
      <button class="ticker" id="ticker" type="button" aria-label="開啟現場紀錄"></button>
    </section>
    <section class="panel feedp">
      <h2>現場紀錄 <span>最新在上</span></h2>
      <div class="feed" id="feed"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel">
      <h2>人員 <span>先點人再點任務｜黃：派遣中　紅：危險區</span></h2>
      <div class="utabs" id="utabs" role="tablist"></div>
      <div class="qsel" id="qsel"><button class="btn" type="button" data-q="2">選 2 人</button><button class="btn" type="button" data-q="3">選 3 人</button><button class="btn" type="button" data-q="0">全選待命</button><button class="btn" type="button" data-q="-1">清除</button><span class="cnt" id="selCnt"></span></div>
      <div class="crewlist" id="crew"></div>
    </section>
    <section class="panel">
      <h2>任務</h2>
      <div id="tasks"></div>
    </section>
  </div>
</main>

<div class="overlay show" id="start">
  <div class="sheet">
    <h1>消防指揮情境訓練</h1>
    <p>你是第一梯次帶隊官。到場後時間就開始流動，狀況會自己惡化，所有決定都會被記錄，結束後產生事後檢討（AAR）。</p>
    <div class="sclist" id="sclist"></div>
    <p id="briefTxt"></p>
    <div class="two">
      <div><label for="optName">姓名</label><input id="optName" autocomplete="name" placeholder="例：王小明"></div>
      <div><label for="optUnit">單位</label><input id="optUnit" placeholder="例：成功分隊"></div>
      <div><label for="optCrew">本隊出勤人數（含帶隊官）</label><select id="optCrew"><option value="3">3 人</option><option value="4" selected>4 人</option><option value="5">5 人</option><option value="6">6 人</option></select></div>
      <div><label>同時抵達的支援單位（最多 2 個）</label><div class="row" style="margin:0;align-items:center"><button class="btn" id="bExM" type="button" aria-label="減少支援單位">－</button><b id="exTxt" style="min-width:150px;text-align:center"></b><button class="btn" id="bExP" type="button" aria-label="增加支援單位">＋</button></div><input type="hidden" id="optExtra" value="0">

<script>
/* ================= 共用設定 ================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzrL1PyDgbnfsrLX9abdJHh5pPbULZWXXjz5P0N0nTrTtQq3AJuJkMhiyyqPWWyK1Er/exec';   // ← 貼上 GAS 網頁應用程式網址（https://script.google.com/macros/s/.../exec），留空則不上傳
const AIR = 900, AIR_WARN = 300;

const $ = s => document.querySelector(s);
let S = null, M = null, timer = null, toastT = null, curZone = null, selSc = 'S001';
let audioCtx = null, soundOn = true;
const selected = new Set();
const fmt = t => `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const ft = t => t==null ? '未執行' : `T+${fmt(t)}`;
const crewById = id => S.crew.find(c=>c.id===id);
const actOf = id => S.active.filter(a=>a.def.id===id);
const has = id => actOf(id).length>0;
const V = id => S.victims.find(v=>v.id===id);
const names = ids => ids.map(i=>crewById(i).name).join('、');
const hpTxt = h => h>60?'穩定':h>30?'微弱':'危急';
const vcol = h => h>60?'#23824f':h>30?'#e39b00':'#c8102e';

function log(msg, type='info'){
  S.log.unshift({t:S.t, msg, type});
  if(type==='alert'){ S.tipFlag=true; pushAlert(msg); }
  else if((type==='good'||type==='radio')&&S.t>0&&!/^(帶隊官|初期報告|同時抵達)/.test(msg)){ S.tipFlag=true; pushTip(msg,type); }
  renderFeed();
}
function pushTip(msg,type){
  if(!S||S.over) return;
  const box=$('#tips'), h=document.querySelector('header.top');
  box.style.top=((h?h.getBoundingClientRect().bottom:62)+8)+'px';
  while(box.children.length>=3) box.firstChild.remove();
  const d=document.createElement('div'); d.className='tip'+(type==='good'?' good':''); d.innerHTML=`${msg}<small>T+${fmt(S.t)}</small>`;
  box.appendChild(d); requestAnimationFrame(()=>d.classList.add('show'));
  setTimeout(()=>{d.classList.remove('show');setTimeout(()=>d.remove(),300);},4000);
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2400);}
function rescue(v, how){
  v.known=true; v.status='out'; v.outAt=S.t;
  log(`${how}救出${v.name}，移至救護區（生命徵象：${hpTxt(v.hp)}）`,'good');
}
function addCrew(list){
  list.forEach((n,i)=>S.crew.push({id:'r'+S.crew.length,u:'R',name:n,ab:'援'+(i+1),cmd:false,task:null,inside:false,air:AIR,gone:false,note:''}));
}
function drawOut(x,y){
  let s='',i=0;
  S.victims.forEach(v=>{ if(v.status!=='out') return; const xx=x+i*15; i++;
    s+=`<circle cx="${xx}" cy="${y}" r="6" fill="${vcol(v.hp)}" stroke="#fff"/><text x="${xx}" y="${y-9}" font-size="8" fill="var(--ink)" text-anchor="middle">${v.name.slice(0,2)}</text>`; });
  return s;
}
const truckSvg = (x,y,l,fill='#c8102e',w=46) =>
  `<rect x="${x}" y="${y}" width="${w}" height="18" rx="2" fill="${fill}" stroke="${fill==='#fff'?'#c8102e':'none'}" stroke-width="1.5"/><text x="${x+w/2}" y="${y+13}" font-size="9" fill="${fill==='#fff'?'#c8102e':'#fff'}" text-anchor="middle" font-weight="700">${l}</text>`;
const flames = (xs,base,h) => xs.map(x=>`<path class="flame" d="M${x-7} ${base} Q${x-6} ${base-h*0.6} ${x} ${base-h} Q${x+6} ${base-h*0.6} ${x+7} ${base}Z" fill="#ff8c1a" opacity=".9"/>`).join('');
const smk = c => `rgba(30,28,27,${Math.min(.9,Math.max(0,c/100)).toFixed(2)})`;

/* ---------- 共用任務 ---------- */
const COMMON = {
  care:{id:'care', zone:'救護', name:'傷患照護', min:1,max:1, dur:null, desc:'持續：照護已救出的傷患',
    avail:()=>S.victims.some(v=>v.status==='out')?true:'尚無救出傷患'},
  transport:{id:'transport', zone:'救護', name:'救護車後送', min:1,max:2, dur:10, desc:'後送人員隨車離開現場',
    avail:()=>S.amb<=0?'現場沒有救護車':!S.victims.some(v=>v.status==='out')?'尚無救出傷患':true,
    done:a=>{
      S.amb--; if(a.crew.length===1) S.ck.transportSolo=true;
      const out=S.victims.filter(v=>v.status==='out'); out.forEach(v=>v.status='transported');
      a.crew.forEach(id=>{const c=crewById(id);c.gone=true;c.note='隨車後送';});
      log(`救護車後送 ${out.map(v=>v.name).join('、')}，${names(a.crew)}隨車離開。`,'radio');}},
};
const makeRit = zone => ({id:'rit', zone, name:'成立 RIT 待命', min:2,max:2, dur:null, desc:'持續：快速救援小組',
  avail:()=>true, start:()=>{if(S.ck.rit==null)S.ck.rit=S.t;log('RIT 成立待命。','good');}});

/* ================= 情境 S001：透天厝火災 ================= */
const S001 = {
  id:'S001', tag:'火災', title:'夜間透天厝一樓機車起火',
  brief:'凌晨 02:10，受理報案：三層樓透天厝（含頂樓加蓋）一樓冒出濃煙。第一梯次出動水箱車 2 輛、救護車 1 輛。增援單位距離遠，請求後約 8 分鐘到場。',
  arrival:n=>`第一梯次到場：水箱車2輛、救護車1輛，共 ${n} 人。一樓鐵捲門緊閉，門縫冒出濃煙。`,
  hint:'剖面圖：左 A面巷道／右 C面防火巷',
  timeLimit:1200, amb:1,
  zones:['A面','車輛／水源','C面','室內','救護'],
  victims:[
    {id:'kid', name:'孫子（10歲）', room:'3F前側（房門關閉）', hp:100},
    {id:'gma', name:'阿嬤（78歲）', room:'3F後側（房門開啟）', hp:80}],
  P:{F0:38, base:0.06, shutterMul:3, controlledMul:1.5, backMul:1.5, ventMul:1.4, interior:0.42, exterior:0.25, warn:75,
     flow:6, tank1:2000, tank2:2000, reserve:8000, sonAt:100, sonWindow:35},
  init(){
    const P=this.P;
    Object.assign(M,{F:P.F0,St:45,C2:35,C3:30,shutter:false,back:false,ladder:false,bars:false,line:false,hydrant:false,
      tank1:P.tank1,tank2:P.tank2,attackOn:false,know:{A:false,C:false,interview:false},son:'calm',sonDeadline:0,
      ck:{sizeA:null,interview:null,shutter:null,waterAtShutter:null,ventBeforeWater:null,tankDry:false,flashover:null,firstWater:null,knockdown:null,out:null}});
  },
  reinforce:{label:'第二梯次增援', eta:480, deadline:180,
    why:'偏遠地區增援要 8 分鐘以上，3–4 人無法同時救人、攻擊、成立 RIT，越早請求越好。',
    arrive(){ addCrew(['增援隊員1','增援隊員2','增援隊員3']); M.tank2+=S001.P.reserve;
      log('第二梯次到場：增援 3 人＋水庫車 8,000 公升（可用「2號車水量轉入」補水）。','good'); }},
  report:{deadline:150, fields:[
      {k:'bld',label:'建物型態',opts:['透天厝3樓＋頂加','公寓大樓','鐵皮工廠']},
      {k:'floor',label:'起火樓層',opts:['1樓','2樓','3樓','不明']},
      {k:'cond',label:'火煙狀況',opts:['濃煙、未見明火','可見火光','全面燃燒']},
      {k:'vict',label:'受困者',opts:['確認受困（含位置）','疑似有人受困','無人受困','不明']},
      {k:'mode',label:'戰術模式',opts:['攻擊（室內）','過渡（先外後內）','防禦（外部）']},
      {k:'cp',label:'指揮站',opts:['A面1號車旁','未設立']}],
    eval(d){
      const e=[];
      if(d.bld&&d.bld!=='透天厝3樓＋頂加') e.push('建物型態錯誤');
      if(d.floor&&d.floor!=='1樓') e.push(M.know.A?'起火樓層錯誤':'未評估即回報樓層');
      if(d.cond==='全面燃燒') e.push('火煙狀況誇大');
      const k=M.know.interview||V('kid').known;
      if(k&&d.vict&&d.vict!=='確認受困（含位置）') e.push('已掌握受困者卻未回報');
      if(!k&&d.vict==='確認受困（含位置）') e.push('受困者尚未確認就回報確認');
      if(!k&&d.vict==='無人受困') e.push('未查證就排除受困者');
      if(d.cp==='未設立') e.push('未設立指揮站');
      return e;}},
  gauges(){
    const fl=M.F<=0?'撲滅':M.F<15?'受控':(M.ck.flashover!=null&&M.F>=90)?'全面燃燒':M.F>=75?'閃燃徵兆':'成長期';
    return [`火勢<span class="meter"><i style="width:${M.F.toFixed(0)}%"></i></span><b>${fl}</b>`,
      `1號車 <b>${M.hydrant?'消防栓供水':Math.round(M.tank1)+' L'}</b>`, `2號車 <b>${Math.round(M.tank2)} L</b>`];
  },
  cond(v){
    if(v.id==='kid') return M.C3*((M.bars&&!M.attackOn)?1.0:0.65);
    if(v.id==='gma') return M.C3;
    if(v.id==='son') return Math.min(100,M.F*1.1);
    return M.C3;
  },
  tick(){
    const P=this.P;
    let knock=0; M.attackOn=false;
    for(const a of S.active){
      if(a.def.id!=='intAttack'&&a.def.id!=='extAttack') continue;
      if(!wr1()) continue;
      M.attackOn=true;
      knock+=a.def.id==='intAttack'?P.interior:P.exterior*(a.crew.length>=2?1:0.7);
      if(!M.hydrant){ M.tank1-=P.flow;
        if(M.tank1<=0){M.tank1=0; if(!S.warned.dry){S.warned.dry=1;M.ck.tankDry=true;log('1號車水箱見底，水線斷水！','alert');}}}
    }
    if(M.attackOn&&M.ck.firstWater==null) M.ck.firstWater=S.t;
    if(!M.hydrant&&M.tank1>0&&M.tank1<=600&&!S.warned.low){S.warned.low=1;log('1號車水量剩不到 600 公升（約 1.5 分鐘）。','alert');}

    let mul=1;
    if(M.shutter) mul*=has('doorCtl')?P.controlledMul:P.shutterMul;
    if(M.back) mul*=P.backMul;
    if(M.bars&&!M.attackOn) mul*=P.ventMul;
    if(M.F>0&&M.F<100) M.F+=P.base*mul;
    M.F=Math.max(0,Math.min(100,M.F-knock));

    const tgt=M.F*(M.shutter?0.85:1)*(M.back?0.9:1);
    M.St+=(tgt-M.St)*0.015;
    M.C2+=(M.St*0.85-M.C2)*0.01;
    let t3=M.St; if(M.bars) t3*=(M.attackOn||M.F<30)?0.55:1.05;
    M.C3+=(t3-M.C3)*0.008;

    if(M.F>=P.warn&&!S.warned.fw&&M.ck.flashover==null){S.warned.fw=1;log('一樓出現閃燃徵兆：煙層下沉、熱氣變強、天花板有滾燃。','alert');}
    if(M.F>=100&&M.ck.flashover==null){
      M.ck.flashover=S.t; log('一樓閃燃！','alert');
      const ins=S.active.filter(a=>a.def.id==='intAttack'||a.def.id==='search');
      if(ins.length){const ids=ins.flatMap(a=>a.crew);mayday(`一樓閃燃，${names(ids)}受困室內`,ids);if(S.over)return;}
    }
    if(M.F<15&&M.ck.knockdown==null&&M.ck.firstWater!=null){M.ck.knockdown=S.t;log('火勢已獲控制。','good');}
    if(M.F<=0&&M.ck.out==null){M.ck.out=S.t;log('火勢撲滅，進入殘火處理。','good');}

    for(const v of S.victims){
      if(v.status!=='trapped') continue;
      v.hp-=Math.max(0,this.cond(v)-30)*(v.id==='son'?0.03:0.015);
      if(v.hp<=0){v.hp=0;v.status='dead';v.deadAt=S.t;}
    }
    const kid=V('kid');
    if(M.know.A&&S.t>=70&&!kid.known&&kid.status==='trapped'){kid.known=true;log('三樓前窗有孩童隔著鐵窗呼救！','alert');}
    if(M.son==='calm'&&!M.know.interview&&S.t>=P.sonAt){
      M.son='agitated';M.sonDeadline=S.t+P.sonWindow;
      log('屋主兒子情緒激動，拿著鑰匙要衝進去救母親！','alert');
    }
    if(M.son==='agitated'&&S.t>=M.sonDeadline&&!has('interview')){
      M.son='entered';
      S.victims.push({id:'son',name:'屋主兒子',room:'1F樓梯',hp:100,status:'trapped',known:true});
      log('屋主兒子由鐵捲門側小門衝進火場，沒有出來！','alert');
    }
  },
  endCheck(){ if(S.victims.every(v=>v.status!=='trapped')&&M.F<=0) return '火勢撲滅，受困者均已處置'; },
  idle:()=>[100,198],
  pos(a){
    if(a.def.id==='search'){const pr=1-a.left/a.total;return [220,pr<0.5?250-pr*2*110:140+(pr-0.5)*2*110];}
    return ({sizeA:[112,230],interview:[84,214],stopSon:[118,232],forceShutter:[116,252],doorCtl:[120,238],extAttack:[110,250],
      ladder:[96,254],cutBars:[118,150],ladderRescue:[150,128],rit:[78,198],pump:[64,244],layLine:[90,256],hydrant:[14,278],transfer:[64,222],
      sizeC:[332,248],forceBack:[322,250],intAttack:[178,250],care:[60,180],transport:[40,180]})[a.def.id];
  },
  scene(){
    const F=M.F;
    let s=`<rect width="420" height="262" fill="var(--sky)"/><rect y="262" width="420" height="38" fill="var(--ground)"/>`;
    s+=`<text x="6" y="16" font-size="11" font-weight="700" fill="var(--ink)">A面 巷道</text><text x="414" y="16" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="end">C面 防火巷</text>`;

  {id:'isolate', zone:'偵檢／管制', name:'設立隔離管制區', min:1,max:2, dur:a=>a.crew.length>=2?60:90, desc:'拉警戒線、阻絕人車進入',

  {id:'evac', zone:'偵檢／管制', name:'下風處民宅疏散', min:1,max:2, dur:a=>a.crew.length>=2?150:240, desc:'1人240秒／2人150秒',

  makeRit('偵檢／管制'),
  {id:'estFoam', zone:'水源／泡沫', name:'估算油池面積與泡沫需求量', min:1,max:1, dur:30, desc:'目測油池、以碳氫類 4.1 L/分/㎡ 估算原液、水量與瞄子數',

     const P=S003.P, est=Math.max(5,Math.round(M.pool/1000/P.depth*1.15/5)*5);     // 目測偏大約 15%，取 5 的倍數
     const flowL=est*P.appRate, sol=flowL*P.appMin, conc=sol*P.conc, drums=Math.ceil(conc/P.drum-1e-9), waterT=(sol-conc)/1000;
     const nozzles=Math.ceil(flowL/60/P.flow-1e-9);
     M.ck.foamPlan=S.t; M.ck.planShort=(M.foam<conc&&!M.tanker)||(M.water<sol-conc&&!M.tanker);
     log(`泡沫估算：油池約 ${est} ㎡（目測，有誤差）；施放率需 ${Math.round(flowL)} L/分（約 ${Math.round(flowL/3.785)} gpm，${nozzles} 支瞄子，單支約 ${Math.round(P.flow*60/3.785)} gpm）；灑佈 ${P.appMin} 分鐘需原液約 ${Math.round(conc)} L（${drums} 桶）、水約 ${waterT.toFixed(1)} 噸。現有原液 ${Math.round(M.foam)} L、水 ${Math.round(M.water)} L。${M.leak>1?'洩漏尚未停止，油池還會擴大，備量要抓多。':''}`,'radio');}},
  {id:'pump', zone:'水源／泡沫', name:'操作泵浦', min:1,max:1, dur:null, desc:'持續：泡沫要出來必須有人', avail:()=>true},
  {id:'layLine', zone:'水源／泡沫', name:'佈設泡沫水線', min:1,max:2, dur:a=>Math.round((a.crew.length>=2?60:90)*M.distMul), desc:'',
   avail:()=>M.line?'已完成':true, done:()=>{M.line=true;log('泡沫水線佈設完成。');}},
  {id:'inductor', zone:'水源／泡沫', name:'架設泡沫比例混合器', min:1,max:1, dur:40, desc:'3% 混合比例（泡沫桶身標示 3%）',
   avail:()=>M.inductor?'已完成':true, done:()=>{M.inductor=true;log('泡沫比例混合器架設完成（3%）。');}},
  {id:'foamBlanket', zone:'水源／泡沫', name:'泡沫覆蓋油池', min:1,max:2, dur:null, idlh:true, desc:'持續：1 人＝1 支（渦輪瞄子＋延伸泡沫管＋比例混合器，10kg、射程約 10m、一桶 20L 約 5 分 30 秒用完）、2 人＝2 支，流量與消耗加倍；施放率不足時覆蓋率上不去',
   avail:()=>!M.line?'水線未佈設':!M.inductor?'未架設混合器':!has('pump')?'無人操作泵浦':M.water<=0?'無水':M.foam<=0?'無泡沫原液':true},
  {id:'shuttle', zone:'水源／泡沫', name:'水庫車補水', min:1,max:1, dur:60, desc:'補水 8,000 公升',
   hidden:()=>!M.tanker, avail:()=>true, done:()=>{M.water+=8000;M.tanker=false;log('水庫車補水 8,000 公升。');}},
  hot3({id:'dike', zone:'熱區作業', name:'築堤圍堵、封堵排水溝', min:2,max:2, dur:120, desc:'防止油品流入水溝',
   avail:()=>M.dike?'已完成':M.fire?'起火中':true, start:entry3, done:()=>{M.dike=true;M.ck.dike=S.t;log('已築堤圍堵並封堵排水溝入口。');}}),
  hot3({id:'plug', zone:'熱區作業', name:'關閉緊急停止開關', min:2,max:2, dur:150, desc:'關閉槽車緊急停止開關，截斷出油',
   avail:()=>M.plug?'已完成':M.fire?'起火中':true, start:entry3,
   done:()=>{M.plug=true;M.leak=S003.P.leakPlug;M.ck.plug=S.t;log('槽車緊急停止開關已關閉，洩漏量大幅降低。','good');}}),
  hot3({id:'rescueDrv', zone:'熱區作業', name:'破壞駕駛室救出駕駛', min:2,max:2, dur:180, desc:'',
   avail:()=>V('drv').status!=='trapped'?'已救出':M.fire?'起火中，無法接近':true,
   start:()=>{entry3();if(M.cov<60){M.ck.entryNoFoam=true;log('泡沫尚未覆蓋油池即進入熱區救人！','alert');}},
   done:()=>{const d=V('drv');if(d.status==='trapped'){rescue(d,'破壞駕駛室');M.ck.rescue=S.t;}}}),
  COMMON.care, COMMON.transport,
];

const SC = {S001, S002, S003};

/* ================= 引擎 ================= */
const SUP_ETA = 180;   // 呼叫支援單位後抵達所需秒數
const unitCrew = (u,n) => Array.from({length:n||3},(_,i)=>i===0?[u+'隊長',u+'帶']:[u+'隊員'+i,u+i]).map((c,i)=>({id:'x'+u+i,u,name:c[0],ab:c[1],cmd:false,task:null,inside:false,air:AIR,gone:false,note:''}));
const supLeft = () => ['A','B'].filter(u=>!S.sup.have.includes(u)&&!S.sup.pend.some(p=>p.u===u));
function callSupport(){
  if(!S||S.over||S.choiceOpen) return;
  const u=supLeft()[0]; if(!u){toast('支援單位已全數調派');return;}
  S.sup.pend.push({u,at:S.t+SUP_ETA});
  log(`帶隊官：請指揮中心調派 ${u} 隊（${S.sizes[u]}人）支援。指揮中心：收到，預估 ${SUP_ETA/60} 分鐘到場。`,'radio'); render();
}
function newState(scId,n,mode,extra,sizes){
  extra=extra||0; sizes=Object.assign({A:3,B:3},sizes||{});
  const sc=SC[scId];
  const base=[['帶隊官','帶',true],['隊員甲','甲'],['隊員乙','乙'],['隊員丙','丙'],['隊員丁','丁'],['隊員戊','戊']].slice(0,n);
  S={sc,t:0,n,extra,sizes,mode,runId:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tester:{name:'',unit:''},sent:false,
    speed:1,paused:false,choiceOpen:false,over:false,endReason:'',
    crew:[...base.map((c,i)=>({id:'c'+i,u:'own',name:c[0],ab:c[1],cmd:!!c[2],task:null,inside:false,air:AIR,gone:false,note:''})),
      ...['A','B'].slice(0,extra).flatMap(u=>unitCrew(u,sizes[u]))],
    active:[],seq:0,log:[],warned:{},amb:sc.amb,
    victims:sc.victims.map(v=>({...v,status:'trapped',known:!!v.known})),
    reinf:{req:null,arrived:false},
    sup:{have:['A','B'].slice(0,extra),pend:[]},
    ck:{report:null,reportEval:null,reinforce:null,par:[],cmdBusy:0,minOut:null,mayday:null,transportSolo:false,rit:null}};
  M=S.m={}; sc.init();
}

function clickTask(t){
  if(S.over||S.choiceOpen) return;
  if(has(t.id)){toast('這個任務執行中，要改派請先在人員卡按「撤回」');return;}
  const r=t.avail(); if(r!==true){toast(r);return;}
  const ids=[...selected].filter(id=>{const c=crewById(id);return c&&!c.task&&!c.gone;});
  if(new Set(ids.map(id=>crewById(id).u)).size>1){toast('不同單位的人員不能一起執行同一任務');return;}
  if(!ids.length){toast('先點選待命人員，再點任務');return;}
  if(ids.length<t.min){toast(`「${t.name}」需要 ${t.min} 人`);return;}
  if(ids.length>t.max){toast(`「${t.name}」最多 ${t.max} 人`);return;}
  const a={key:++S.seq, def:t, crew:ids, start:S.t};
  a.total = t.dur==null?null:(typeof t.dur==='function'?t.dur(a):t.dur); a.left=a.total;
  S.active.push(a);
  ids.forEach(id=>{const c=crewById(id);c.task=a.key;c.inside=!!t.idlh;});
  log(`${names(ids)}：${t.name}`,'cmd');
  if(t.start) t.start(a);
  selected.clear(); render();
}
function removeActive(a){
  S.active=S.active.filter(x=>x!==a);
  a.crew.forEach(id=>{const c=crewById(id);if(c){c.task=null;c.inside=false;}});
}
function recallCrew(id){
  const c=crewById(id); const a=S.active.find(x=>x.key===c.task); if(!a) return;
  removeActive(a); if(a.def.cancel) a.def.cancel();
  log(`${a.def.name}中止，${names(a.crew)}撤回待命`,'cmd'); render();
}
function toggleSel(id){
  const c=crewById(id); if(S.over||c.gone) return;
  if(c.task){toast('執行任務中，要改派請先按「撤回」');return;}
  if(!selected.has(id)&&[...selected].some(i=>crewById(i).u!==c.u)){toast('不同單位的人員不能一起執行任務，請先取消已選的其他單位人員');return;}
  selected.has(id)?selected.delete(id):selected.add(id); renderCrew(); renderScene();
}
function reqReinf(){
  if(S.over) return;
  if(S.reinf.req!=null){toast('已請求增援');return;}
  S.reinf.req=S.t; S.ck.reinforce=S.t;
  log(`帶隊官：請求${S.sc.reinforce.label}。指揮中心：收到，預估 ${Math.round(S.sc.reinforce.eta/60)} 分鐘到場。`,'radio'); render();
}
function doPar(){
  if(S.over) return;
  const on=S.crew.filter(c=>!c.gone), ins=on.filter(c=>c.inside);
  S.ck.par.push(S.t);
  log(`PAR 點名：危險區內 ${ins.length} 人、外圍 ${on.length-ins.length} 人，全員回應。`,'radio');
}
function buildReportForm(){
  $('#rFields').innerHTML=S.sc.report.fields.map(f=>`<label for="rf_${f.k}">${f.label}</label><select id="rf_${f.k}"><option value="">請選擇</option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`).join('');
  $('#rReq').value='no';
}
function openReport(){
  if(S.over) return;
  if(S.ck.report!=null){toast('初期報告已發送');return;}
  $('#report').classList.add('show');
}
function sendReport(){
  const d={}; S.sc.report.fields.forEach(f=>d[f.k]=$('#rf_'+f.k).value);
  const missing=Object.keys(d).filter(k=>!d[k]);
  const errs=S.sc.report.eval(d);
  S.ck.report=S.t; S.ck.reportEval={d,errs,missing};
  log('初期報告：'+S.sc.report.fields.map(f=>`${f.label} ${d[f.k]||'—'}`).join('；')+'。','radio');
  if($('#rReq').value==='yes') reqReinf();
  $('#report').classList.remove('show'); render();
}
function mayday(reason, ids){
  if(S.ck.mayday) return;
  const rit=has('rit');
  S.ck.mayday={t:S.t, reason, rit};
  log(`MAYDAY！MAYDAY！${reason}`,'alert');
  if(rit){
    S.active.filter(a=>a.crew.some(i=>ids.includes(i))).forEach(removeActive);
    ids.forEach(id=>{const c=crewById(id);c.gone=true;c.note='受傷送醫';});
    log('RIT 立即進入，受困隊員已救出送醫。','good');
  } else endGame(`MAYDAY：${reason}，現場沒有 RIT 可以立即救援`);
}
function choice(title,msg,opts){
  S.choiceOpen=true;
  $('#choiceTitle').textContent=title; $('#choiceMsg').textContent=msg;
  const box=$('#choiceOpts'); box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=o.label;
    b.onclick=()=>{$('#choice').classList.remove('show');S.choiceOpen=false;o.fn();render();};box.appendChild(b);});
  $('#choice').classList.add('show'); beep();
}

function tick(){
  if(!S||S.over||S.paused||S.choiceOpen) return;
  S.t++;
  for(const a of [...S.active]){
    if(a.total!=null){a.left--; if(a.left<=0){removeActive(a); S.tipFlag=false; if(a.def.done) a.def.done(a); if(S.over) return; if(!S.tipFlag) pushTip(`✓ 完成：${names(a.crew)}：${a.def.name}`,'good');}}
  }
  S.sc.tick(); if(S.over) return;
  for(const v of S.victims){
    if(v.status!=='out') continue;
    if(has('care')) v.hp=Math.min(100,v.hp+0.02);
    else {v.hp-=(v.outDrain??0.03); if(v.hp<=0){v.hp=0;v.status='dead';v.deadAt=S.t;log(`${v.name}救出後無人照護，傷重。`,'alert');}}
  }
  for(const c of S.crew){
    if(!c.inside||c.gone) continue;
    c.air--;
    if(c.air===AIR_WARN) log(`${c.name}空氣瓶低壓警報（剩約5分鐘）`,'alert');
    if(c.air<=0){const a=S.active.find(x=>x.key===c.task);mayday(`${c.name}空氣耗盡`,a?a.crew:[c.id]);if(S.over)return;}
  }
  const rf=S.sc.reinforce;
  if(S.reinf.req!=null&&!S.reinf.arrived&&S.t>=S.reinf.req+rf.eta){S.reinf.arrived=true;rf.arrive();}
  for(const p of [...S.sup.pend]) if(S.t>=p.at){
    S.sup.pend=S.sup.pend.filter(x=>x!==p); S.sup.have.push(p.u); S.crew.push(...unitCrew(p.u,S.sizes[p.u]));
    log(`${p.u} 隊（${S.sizes[p.u]}人）抵達現場，向帶隊官報到。各單位不併組作業。`,'good');
  }
  if(S.crew[0].task) S.ck.cmdBusy++;
  if(S.crew.some(c=>c.inside&&!c.gone)){
    const outN=S.crew.filter(c=>!c.gone&&!c.inside).length;
    S.ck.minOut=S.ck.minOut==null?outN:Math.min(S.ck.minOut,outN);
  }
  render();
  if(S.t>=S.sc.timeLimit) return endGame('演練時間到');
  const r=S.sc.endCheck(); if(r) endGame(r);
}

/* ---------- 畫面 ---------- */
function render(){renderTop();renderScene();renderCrew();updateTasks();}
function renderTop(){
  $('#clock').innerHTML=`T+${fmt(S.t)}<small>${S.mode==='exam'?'考核':'練習'}${S.paused?'｜已暫停':''}</small>`;
  const r=S.reinf, rf=S.sc.reinforce;
  const rTxt=r.req==null?'未請求':r.arrived?'已到場':`約 ${fmt(Math.max(0,r.req+rf.eta-S.t))}`;
  $('#gauges').innerHTML=[...S.sc.gauges(), `增援 <b>${rTxt}</b>`, ...(S.sup.pend.length?[`支援單位 <b>${S.sup.pend.map(p=>p.u+'隊 '+fmt(Math.max(0,p.at-S.t))).join('、')}</b>`]:[]), `救護車 <b>${S.amb>0?S.amb+' 輛在場':'已後送'}</b>`].map(g=>`<span>${g}</span>`).join('');
  $('#bPause').style.display=S.mode==='exam'?'none':'';
  $('#bPause').textContent=S.paused?'繼續':'暫停';
  const sl=supLeft().length; $('#bSup').textContent=sl?`呼叫支援單位（剩 ${sl}）`:'支援單位已調派'; $('#bSup').disabled=!sl||S.over;
  $('#bSound').textContent=`提示音：${soundOn?'開':'關'}`;
  document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===S.speed));
}
function renderScene(){
  let s=S.sc.scene();
  const groups={};
  S.crew.filter(c=>!c.gone).forEach(c=>{
    const a=c.task?S.active.find(x=>x.key===c.task):null;
    const p=(a&&S.sc.pos(a))||S.sc.idle();
    const k=p.join(','); (groups[k]=groups[k]||{p,list:[]}).list.push(c);
  });
  Object.values(groups).forEach(g=>g.list.forEach((c,i)=>{
    const x=g.p[0]+(i%6)*13-((Math.min(g.list.length,6)-1)*6.5), y=g.p[1]-Math.floor(i/6)*13;
    const st=selected.has(c.id);
    s+=`<circle cx="${x}" cy="${y}" r="6.5" fill="${c.cmd?'#c8102e':c.inside?'#7a1020':'#16202a'}" stroke="${st?'#5c9bff':'#fff'}" stroke-width="${st?2.5:1.2}"/><text x="${x}" y="${y+3}" font-size="${c.ab.length>1?6:8}" fill="#fff" text-anchor="middle" font-weight="700">${c.ab}</text>`;
  }));
  $('#scene').innerHTML=s;
}
let curUnit='own';
const UNIT_LABEL={own:'本隊',A:'A 隊',B:'B 隊',R:'增援'};
function renderUnitTabs(){
  const us=['own','A','B','R'].filter(u=>S.crew.some(c=>c.u===u));
  if(!us.includes(curUnit)) curUnit='own';
  $('#utabs').innerHTML=us.map(u=>{
    const m=S.crew.filter(c=>c.u===u&&!c.gone), idle=m.filter(c=>!c.task).length, busy=m.length-idle;
    const warn=m.some(c=>c.inside&&c.air<=AIR_WARN);
    return `<button type="button" role="tab" class="utab${u===curUnit?' on':''}${warn?' warn':''}" data-u="${u}" aria-selected="${u===curUnit}">${UNIT_LABEL[u]}<small>待命 ${idle}／任務 ${busy}</small><i class="dot"></i></button>`;
  }).join('');
  document.querySelectorAll('.ugrp').forEach(g=>g.classList.toggle('act',g.dataset.u===curUnit));
  const n=[...selected].length; $('#selCnt').textContent=n?`已選 ${n} 人：${names([...selected])}`:'尚未選人（點人員卡片，或用上面的快速鍵）';
}
function quickSel(n){
  if(!S||S.over||S.choiceOpen) return;
  selected.clear();
  if(n>=0){
    const idle=S.crew.filter(c=>c.u===curUnit&&!c.gone&&!c.task);
    const pick=n===0?idle:idle.slice(0,n);
    if(!pick.length) toast('這個單位目前沒有待命人員');
    else if(n>0&&pick.length<n) toast(`這個單位只有 ${pick.length} 人待命`);
    pick.forEach(c=>selected.add(c.id));
  }
  renderCrew(); renderScene();
}
$('#utabs').onclick=e=>{const b=e.target.closest('.utab'); if(!b) return; if(curUnit!==b.dataset.u){curUnit=b.dataset.u;selected.clear();renderScene();} renderCrew();};
$('#qsel').onclick=e=>{const b=e.target.closest('[data-q]'); if(b) quickSel(+b.dataset.q);};
function renderCrew(){
  const box=$('#crew');
  if(box.dataset.n!==String(S.crew.length)){
    box.innerHTML='';
    const UL={own:'本隊',A:'A 隊',B:'B 隊',R:'增援'};
    ['own','A','B','R'].forEach(u=>{
      const list=S.crew.filter(c=>c.u===u); if(!list.length) return;
      const g=document.createElement('div');g.className='ugrp';g.dataset.u=u;
      g.innerHTML=`<div class="uhd">${UL[u]}（${list.length}人）</div>`;
      list.forEach(c=>{
        const d=document.createElement('div');d.className='crew'+(c.cmd?' cmd':'');d.dataset.id=c.id;d.dataset.u=c.u;d.tabIndex=0;d.setAttribute('role','button');
        d.innerHTML=`<div class="cav">${c.ab}</div><div class="cinfo"><b>${c.name}</b><span class="cst"></span><div class="air"><i></i></div></div><button class="recall" type="button">撤回</button>`;
        d.onclick=()=>toggleSel(c.id);
        d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSel(c.id);}};
        d.querySelector('.recall').onclick=e=>{e.stopPropagation();recallCrew(c.id);};
        g.appendChild(d);
      });
      box.appendChild(g);
    });
    box.dataset.n=String(S.crew.length);
  }
  S.crew.forEach(c=>{
    const d=box.querySelector(`[data-id="${c.id}"]`); const a=c.task?S.active.find(x=>x.key===c.task):null;
    d.classList.toggle('sel',selected.has(c.id)); d.classList.toggle('busy',!!a&&!c.gone);
    d.classList.toggle('inside',c.inside&&!c.gone); d.classList.toggle('gone',c.gone);

function beep(){
  if(!soundOn) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=audioCtx.currentTime;
    [0,0.18].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=i?660:880;
      g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.12,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.15);
      o.connect(g);g.connect(audioCtx.destination);o.start(t0+d);o.stop(t0+d+0.16);});
  }catch(e){}
}

/* 上傳到 GAS：錯開時間、失敗自動重試；只有真的收到成功回應才算成功（後台以編號去重，重送是安全的） */
const sleepMs = ms => new Promise(r=>setTimeout(r,ms));
async function postGAS(payload, onStatus, jitterMax){
  const opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)};
  if(jitterMax){ onStatus('排隊上傳中，請稍候…'); await sleepMs(Math.random()*jitterMax); }
  const waits=[0,2500,6000,12000];
  for(let i=0;i<waits.length;i++){
    if(i>0){ onStatus(`後台忙碌，${Math.round(waits[i]/1000)} 秒後重試（第 ${i+1} 次）…`); await sleepMs(waits[i]+Math.random()*2000); }
    else onStatus('上傳中…');
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),75000);
      const r=await fetch(GAS_URL,{...opt,signal:ctl.signal}); clearTimeout(to);
      const j=await r.json();
      if(j.ok) return {ok:true,dup:!!j.dup};
    }catch(e){}
  }
  try{ await fetch(GAS_URL,{...opt,mode:'no-cors'}); }catch(e){}   // 最後再送一次（無法確認回應）
  return {ok:false};
}
async function sendAAR(items){
  const st=$('#sendStatus'); if(!st) return;
  if(!GAS_URL){st.textContent='尚未設定 Google Sheets 網址，本次結果未上傳。';return;}
  if(S.t<240){st.textContent='操作未達 4 分鐘，本次結果不上傳後台。';return;}
  if(S.sent){st.textContent='✓ 本次結果已上傳。';return;}
  const c=S.ck;
  const payload={
    runId:S.runId, name:S.tester.name, unit:S.tester.unit, scenario:`${S.sc.id} ${S.sc.title}`,
    crew:S.n, extraUnits:S.extra, unitSizes:S.extra?['A','B'].slice(0,S.extra).map(u=>u+S.sizes[u]).join(','):'', mode:S.mode, reason:S.endReason, duration:S.t,
    saved:S.victims.filter(v=>(v.status==='out'||v.status==='transported')&&v.hp>0).length, total:S.victims.length,
    victims:S.victims.map(v=>({name:v.name,status:stTxt(v)+(v.status==='dead'?'':`（${hpTxt(v.hp)}）`)})),
    flashover:(S.sc.id==='S001'&&M.ck.flashover!=null)?M.ck.flashover:null, mayday:c.mayday,
    checks:items.map(i=>({item:i[0],pass:i[1],detail:i[2]})),
    passCount:items.filter(i=>i[1]===true).length, checkCount:items.filter(i=>i[1]!==null).length,
    log:[...S.log].reverse()
  };
  const res=await postGAS(payload, m=>{const e=$('#sendStatus'); if(e) e.textContent=m;}, 8000);
  const e2=$('#sendStatus'); if(!e2) return;
  if(res.ok){ S.sent=true; e2.textContent=res.dup?'✓ 此紀錄先前已上傳。':'✓ 已上傳到 Google Sheets。'; }
  else e2.textContent='⚠ 尚未確認上傳成功（後台忙碌或網路不穩）。請稍後按「重新上傳」，重複上傳不會產生重複紀錄。';
}

function aarCanvas(items){
  const W=1080, P=56, MAXH=14000;
  const FONT='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif';
  const cv=document.createElement('canvas'); cv.width=W; cv.height=MAXH;
  const g=cv.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,W,MAXH); g.textBaseline='top';
  const font=(sz,w)=>{g.font=`${w||400} ${sz}px ${FONT}`;};
  const text=(t,x,yy,sz,color,w,align)=>{font(sz,w);g.fillStyle=color;g.textAlign=align||'left';g.fillText(t,x,yy);g.textAlign='left';};
  const wrap=(t,x,yy,maxW,sz,lh,color,w)=>{font(sz,w);g.fillStyle=color;let line='';
    for(const ch of String(t)){ if(line&&g.measureText(line+ch).width>maxW){g.fillText(line,x,yy);yy+=lh;line=ch.trim()?ch:'';} else line+=ch; }
    if(line){g.fillText(line,x,yy);yy+=lh;} return yy;};
  const rule=yy=>{g.fillStyle='#dde2e7';g.fillRect(P,yy,W-P*2,2);};
  const section=(title,yy)=>{g.fillStyle='#c8102e';g.fillRect(P,yy+4,7,32);text(title,P+20,yy,30,'#16202a',800);return yy+56;};
  const c=S.ck, now=new Date(), pad=n=>String(n).padStart(2,'0');

  g.fillStyle='#c8102e'; g.fillRect(0,0,W,176);

  let y=wrap(S.sc.title,P,78,W-P*2,46,58,'#ffffff',800);

  const info=[['受訓人員',`${S.tester.name||'未填'}${S.tester.unit?'（'+S.tester.unit+'）':''}`],['演練日期',dstr],['情境代碼',S.sc.id],
    ['出勤人數',`${S.n} 人${S.extra?`＋支援 ${['A','B'].slice(0,S.extra).map(u=>u+'隊'+S.sizes[u]+'人').join('、')}`:''}`],['模式',S.mode==='exam'?'考核':'練習'],['演練時間',`T+${fmt(S.t)}`]];
  const colW=(W-P*2)/3;
  info.forEach((it,i)=>{const x=P+(i%3)*colW, yy=y+Math.floor(i/3)*82; text(it[0],x,yy,20,'#5b6672',600); wrap(it[1],x,yy+28,colW-20,27,34,'#16202a',700);});
  y+=82*2+6;
  y=wrap(`結束原因：${S.endReason}`,P,y,W-P*2,24,34,'#16202a',600)+22;

  const saved=S.victims.filter(v=>(v.status==='out'||v.status==='transported')&&v.hp>0).length;
  const pass=items.filter(i=>i[1]===true).length, applic=Math.max(1,items.filter(i=>i[1]!==null).length), pr=pass/applic;
  const boxes=[['救出',`${saved} / ${S.victims.length}`,saved===S.victims.length?'#23824f':'#c8102e'],

    ['MAYDAY',c.mayday?`T+${fmt(c.mayday.t)}`:'無',c.mayday?'#c8102e':'#23824f']];
  const bw=(W-P*2-32)/3;
  boxes.forEach((b,i)=>{const x=P+i*(bw+16);g.fillStyle='#f1f4f6';g.fillRect(x,y,bw,124);g.fillStyle=b[2];g.fillRect(x,y,bw,8);
    text(b[0],x+22,y+24,22,'#5b6672',600);text(b[1],x+22,y+58,44,b[2],800);});

  y=section('傷患／受困者',y);

  const out=document.createElement('canvas'); out.width=W; out.height=Math.min(MAXH,y);

  a.href=url; a.download=aarName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('已下載；若沒有反應，請長按或右鍵圖片另存');
}
async function shareAARImage(){
  if(!aarBlob){toast('圖片處理中，請稍候再按');return;}
  const f=new File([aarBlob],aarName,{type:'image/png'});
  if(!(navigator.canShare&&navigator.canShare({files:[f]}))){toast('這台裝置不支援分享圖片，請改用下載');return;}
  try{ await navigator.share({files:[f],title:'AAR 報告'}); }
  catch(e){ if(e.name!=='AbortError') toast('分享失敗，請改用下載'); }
}

/* ---------- 意見回饋 ---------- */
let fbHeld=false, fbIdCur=null;
function openFb(){
  if(S&&!S.over&&!S.choiceOpen){S.choiceOpen=true;fbHeld=true;}
  $('#fbSc').value=(S&&S.t>0)?S.sc.id:'整體';
  $('#fbStatus').textContent=''; $('#bFbSend').disabled=false;
  $('#fb').classList.add('show');
}
function closeFb(){
  $('#fb').classList.remove('show');
  if(fbHeld&&S){S.choiceOpen=false;fbHeld=false;}
}
async function sendFb(){
  const st=$('#fbStatus'), g=id=>$(id).value.trim();
  const d={type:'feedback', fbId:(fbIdCur=fbIdCur||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    name:$('#optName').value.trim()||'未填', unit:$('#optUnit').value.trim(), scenario:g('#fbSc'),
    real:g('#fbReal'), diff:g('#fbDiff'), timing:g('#fbTime'), bad:g('#fbBad'), sug:g('#fbSug'),
    runId:(S&&S.t>0)?S.runId:'', mode:(S&&S.t>0)?S.mode:''};
  if(!d.real&&!d.diff&&!d.timing&&!d.bad&&!d.sug){st.textContent='請至少填寫一個欄位。';return;}
  if(!GAS_URL){st.textContent='尚未設定 Google Sheets 網址，無法送出。';return;}
  st.textContent='送出中…'; $('#bFbSend').disabled=true;
  const res=await postGAS(d, m=>{st.textContent=m;}, 0);
  if(res.ok){fbIdCur=null;st.textContent='✓ 已送出，謝謝你的意見。';['#fbReal','#fbDiff','#fbTime','#fbBad','#fbSug'].forEach(i=>$(i).value='');}
  else{st.textContent='⚠ 尚未確認送出成功，請稍後再按一次「送出回饋」（重複送出不會產生重複紀錄）。';}
  $('#bFbSend').disabled=false;
}
$('#bFb').onclick=openFb; $('#bFbSend').onclick=sendFb; $('#bFbClose').onclick=closeFb; $('#bFbStart').onclick=openFb;

/* ---------- 啟動 ---------- */
function setSpeed(x){S.speed=x;clearInterval(timer);timer=setInterval(tick,1000/x);renderTop();}
function renderScList(){
  $('#sclist').innerHTML=Object.values(SC).map(sc=>`<button class="sc${sc.id===selSc?' on':''}" type="button" data-sc="${sc.id}"><span class="tag">${sc.tag}</span><b>${sc.title}</b><small>${sc.id}｜時限 ${sc.timeLimit/60} 分鐘</small></button>`).join('');
  document.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{selSc=b.dataset.sc;renderScList();});
  $('#briefTxt').textContent=SC[selSc].brief;
}
function startGame(scId,n,mode,extra,sizes){
  scId=scId||selSc; n=n||+$('#optCrew').value; mode=mode||$('#optMode').value; extra=extra==null?+$('#optExtra').value:extra; sizes=sizes||{A:+$('#optSzA').value,B:+$('#optSzB').value};
  const nm=$('#optName').value.trim(), un=$('#optUnit').value.trim();
  if(GAS_URL&&!nm){$('#aar').classList.remove('show');$('#start').classList.add('show');toast('請先填寫姓名，結果才能對應到人');$('#optName').focus();return;}
  try{localStorage.setItem('fgc_tester',JSON.stringify({nm,un}));}catch(e){}
  try{$('#introVid').pause();}catch(e){}
  clearInterval(timer); alertQ.length=0; nextAlert(); $('#tips').innerHTML='';
  newState(scId,n,mode,extra,sizes); selected.clear(); curUnit='own'; curZone=S.sc.zones[0];
  S.tester={name:nm||'未填',unit:un};
  $('#crew').dataset.n=''; buildTasks(); buildReportForm();
  $('#scTitle').innerHTML=`${S.sc.title} <span>${S.sc.hint}</span>`;
  document.title=`${S.sc.title}｜消防指揮情境訓練`;
  ['#start','#aar','#report','#choice','#feedSheet','#imgSheet'].forEach(id=>$(id).classList.remove('show'));
  log(S.sc.arrival(n),'radio');
  if(extra) log(`同時抵達：${['A','B'].slice(0,extra).map(u=>u+'隊（'+sizes[u]+'人）').join('、')}。各單位不併組作業。`,'radio');
  render(); setSpeed(1);
  if(S.sc.onStart) S.sc.onStart();
}

function renderEx(){const n=+$('#optExtra').value;$('#exTxt').textContent=n?`本隊＋${['A','B'].slice(0,n).join('、')} 隊（共 ${n+1} 個單位）`:'只有本隊';$('#exSizes').style.display=n?'flex':'none';$('#szBwrap').style.display=n>=2?'':'none';$('#bExM').disabled=n<=0;$('#bExP').disabled=n>=2;}
$('#bExM').onclick=()=>{$('#optExtra').value=Math.max(0,+$('#optExtra').value-1);renderEx();};
$('#bExP').onclick=()=>{$('#optExtra').value=Math.min(2,+$('#optExtra').value+1);renderEx();};
renderEx();
renderScList();
try{const t=JSON.parse(localStorage.getItem('fgc_tester')||'null');if(t){$('#optName').value=t.nm||'';$('#optUnit').value=t.un||'';}}catch(e){}
$('#bSup').onclick=callSupport;
$('#bIntro').onclick=()=>{const v=$('#introVid');v.style.display='block';v.play().catch(()=>{});};
$('#bStart').onclick=()=>{beep();startGame();};
$('#bSendReport').onclick=sendReport;
$('#bCancelReport').onclick=()=>$('#report').classList.remove('show');
$('#bPause').onclick=()=>{if(!S||S.mode==='exam'||S.over||S.choiceOpen)return;S.paused=!S.paused;renderTop();};
$('#bSound').onclick=()=>{soundOn=!soundOn;if(S)renderTop();if(soundOn)beep();};
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{if(S&&!S.over)setSpeed(+b.dataset.sp);});
$('#bEnd').onclick=()=>{if(S&&!S.over&&confirm('確定結束演練並進行事後檢討？'))endGame('帶隊官結束演練');};
$('#ticker').onclick=()=>$('#feedSheet').classList.add('show');
$('#bCloseFeed').onclick=()=>$('#feedSheet').classList.remove('show');
$('#bDlImg').onclick=downloadAARImage;
$('#bShareImg').onclick=shareAARImage;
$('#bCloseImg').onclick=()=>$('#imgSheet').classList.remove('show');
$('#alertpop').onclick=()=>nextAlert();
// 預覽畫面
newState('S001',4,'practice'); S.over=true; curZone=S.sc.zones[0]; buildTasks(); render(); renderFeed();
</script>
